<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Holy Hotsauce! widget</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Courier New", Consolas, monospace;
    user-select: none;
  }
  #drag {
    -webkit-app-region: drag;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    cursor: grab;
  }
  canvas {
    -webkit-app-region: drag;
    image-rendering: pixelated;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.55));
  }
  #label {
    -webkit-app-region: drag;
    color: #f4e3d3;
    font-size: 10px;
    text-align: center;
    text-shadow: 1px 1px 0 #000, 0 0 4px #000;
    margin-top: 2px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="drag">
    <canvas id="icon" width="192" height="192"></canvas>
    <div id="label">Loading...</div>
  </div>
  <script src="shapes.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
